name: Build Mobile Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-studio-native-cloud-mvp-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Mobile Studio project
        run: |
          mkdir -p project
          unzip -q mobile-studio-native-cloud-mvp-source.zip -d project
          test -f project/app/build.gradle
      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
