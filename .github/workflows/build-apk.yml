name: Build Mobile Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-studio-native-cloud-mvp-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-24.04 GitHub-hosted runners already include Android SDK.
      # Avoid android-actions/setup-android@v3: its obsolete SDK package
      # installation has caused builds to fail before Gradle starts.
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          test -d "$SDK_ROOT" || { echo "Android SDK directory not found"; exit 1; }
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager --version
          sdkmanager --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Mobile Studio project
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile-studio-native-cloud-mvp-source.zip
          mkdir -p project
          unzip -q -o mobile-studio-native-cloud-mvp-source.zip -d project
          test -f project/app/build.gradle
          test -f project/settings.gradle

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Save APK for download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-Android-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
